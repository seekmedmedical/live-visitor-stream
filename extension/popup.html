<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #131820;
        --surface: #1a212b;
        --line: #2a333f;
        --fg: #eef2f6;
        --muted: #8b97a7;
        --live: #37e6a0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 300px;
        background: var(--bg);
        color: var(--fg);
        font-family: "DM Sans", system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .dot {
        width: 9px; height: 9px; border-radius: 999px; background: var(--live);
        box-shadow: 0 0 0 0 rgba(55, 230, 160, 0.55);
        animation: pulse 1.8s infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(55,230,160,.55); }
        70% { box-shadow: 0 0 0 8px rgba(55,230,160,0); }
        100% { box-shadow: 0 0 0 0 rgba(55,230,160,0); }
      }
      #count {
        font-family: ui-monospace, monospace;
        font-size: 30px; font-weight: 700; line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
      ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
      li { padding: 10px 16px; border-bottom: 1px solid var(--line); }
      .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
      .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .num { font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; }
      .bar { height: 3px; border-radius: 999px; background: #232c37; margin-top: 6px; }
      .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--live); }
      footer {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 16px; font-size: 10px; text-transform: uppercase;
        letter-spacing: .08em; color: var(--muted);
      }
      button {
        background: none; border: 1px solid var(--line); color: var(--muted);
        border-radius: 999px; padding: 4px 10px; font-size: 10px; cursor: pointer;
      }
      .warn { padding: 10px 16px; font-size: 11px; color: #ffc24b; border-top: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <header>
      <span class="dot"></span>
      <span id="count">—</span>
      <span class="label">online agora</span>
    </header>
    <ul id="pages"></ul>
    <div id="warn" class="warn" hidden></div>
    <footer>
      <span id="time">—</span>
      <button id="reload">Atualizar</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
